services:
  db:
    image: postgres:17-alpine
    container_name: zero-drop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zero_drop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zero_drop
    ports:
      - "5432:5432"
    volumes:
      - zero_drop_data:/var/lib/postgresql/data

volumes:
  zero_drop_data:
